<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIM SEHA 2026 Portfolio</title>
  <!-- CSS -->
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/intro.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <!-- JavaScript -->
  <script src="./js/script.js" defer></script>
  <script src="./js/intro.js" defer></script>
  <script src="./js/sky.js" defer></script>
  <script src="./js/desktop.js" defer></script>
</head>

<body>
  <!-- loader -->
  <div id="loader">
    <div>LOADING<b><i id="bar"></i></b></div>
  </div>

  <!-- intro : 스크롤 연동 영상 -->
  <section id="intro">
    <div id="sticky">
      <canvas id="cv"></canvas>
      <!-- 첫 화면에서 자동 재생 + 무한 반복 (캔버스에 그려서 사용하므로 화면에는 보이지 않음) -->
      <video id="introVideo" class="intro-video" muted loop autoplay playsinline preload="auto">
        <source src="./src/video/intro.mp4" type="video/mp4">
        <source src="./src/video/intro.webm" type="video/webm">
      </video>

      <header id="hero">
        <img src="./src/seha.svg" alt="KimSeha" class="fade-up delay-1">
        <h6 class="fade-up delay-2">Web Publisher · UI/UX Designer</h6>
      </header>

      <button id="cta" type="button">Scroll to the Works</button>

      <div id="foot" class="fade-up-footer delay-5">
        <div class="copy">
          <b>© 2026. KIM SEHA</b>
          <span>All pictures cannot be copied without permission.</span>
        </div>
        <div class="contact-button-box">
          <button class="user-info" type="button"><a href="https://sehakim.notion.site/d66a9bc391a74955882cf5a59c22f849"
              target="_blank"><img src="./src/user.svg" alt="info"></a></button>
          <div class="email-btn-wrapper">
            <button class="user-mail" type="button" onclick="copyEmail(this)">
              <img src="./src/envelope.svg" alt="mail">
            </button>
            <div class="toast-tooltip">메일 주소 복사하기</div>
          </div>
        </div>
      </div>

      <div id="white"></div>
    </div>
  </section>

  <!-- main home : 스크롤 후 나타나는 프로젝트 화면 -->
  <div id="home" tabindex="-1">
    <!-- 배경화면 (CloudSky) -->
    <div id="sky" aria-hidden="true"><canvas id="skyCv"></canvas></div>

    <!-- 상세 설명 창이 열리는 곳 -->
    <div id="winLayer"></div>

    <!-- 헤더 -->
    <div class="skyHeader">
      <div class="flex-box">
        <img src="./src/color-palette_gray.svg" alt="palette" class="logo">
        <div>Seha Works</div>
        <span><a href="https://sehakim.notion.site/d66a9bc391a74955882cf5a59c22f849" target="_blank">Resume</a></span>
        <span class="mail-copy">
          <span>Mail</span>
          <div class="header-toast-tooltip">메일 주소 복사하기</div>
        </span>
        <span id="exitBtn">Exit</span>
      </div>
      <div class="flex-box">
        <div id="currentDate"></div>
        <div id="currentTime"></div>
      </div>
    </div>
    <!-- 종료 → intro로 -->
    <!-- <button id="exitBtn" type="button" aria-label="종료">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v9" />
        <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
      </svg><span>종료</span>
    </button> -->

    <!-- 바탕화면 폴더 아이콘 (클릭하면 상세 설명 창이 열림). data-project = projectData / <template id="win-...">의 이름 -->
    <nav id="deskIcons" aria-label="포트폴리오">
      <button class="desk-icon" type="button" data-project="dashboard" style="--c1:#7cc0ff;--c2:#3b86f0">
        <img src="./src/dashboard-icon.png" alt="dashboard">
        <span>Dashboard</span>
      </button>
      <button class="desk-icon" type="button" data-project="kiosk" style="--c1:#7be0c4;--c2:#2fb08e">
        <img src="./src/kiosk-icon.png" alt="kiosk">
        <span>Kiosk</span>
      </button>
      <button class="desk-icon" type="button" data-project="pos" style="--c1:#ffc979;--c2:#f0953a">
        <img src="./src/pos-icon.png" alt="pos">
        <span>POS</span>
      </button>
    </nav>

    <nav id="mobileFooter">
      <a class="app-icon" href="https://sehakim.notion.site/d66a9bc391a74955882cf5a59c22f849" target="_blank"
        rel="noopener" data-label="Resume" aria-label="Resume" style="--a1:#ffb86b;--a2:#f0702a">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
        </svg>
      </a>
      <button class="app-icon" type="button" data-app="mail" data-label="메일 주소 복사" aria-label="메일 주소 복사"
        style="--a1:#5cc8ff;--a2:#2b7cf0">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5" />
          <path d="M4 7.5l8 6 8-6" />
        </svg>
      </button>
      <button class="app-icon" type="button" data-app="exit" data-label="종료" aria-label="종료"
        style="--a1:#ff8a8a;--a2:#e0343a">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v9" />
          <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
        </svg>
      </button>
    </nav>
  </div>
</body>

</html>
